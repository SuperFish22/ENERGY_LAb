# Замените lab.example.ru на реальный домен. Сертификат: certbot certonly --webroot -w deploy/certbot-www -d <домен>
server {
    listen 80;
    server_name lab.example.ru;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name lab.example.ru;
    ssl_certificate     /etc/letsencrypt/live/lab.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lab.example.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 30m;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # API бота доступен только с сервера n8n (подставьте его IP)
    location /api/bot/ {
        allow N8N_SERVER_IP;   # ЗАМЕНИТЬ на IP сервера n8n (иначе nginx не запустится)
        deny all;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /static/ { proxy_pass http://web:8000; expires 7d; }
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
