# Energy Lab на nginx самого сервера (рядом с другим сайтом).
# Положить в /etc/nginx/sites-available/energylab.conf, HTTPS добавит certbot --nginx.
server {
    listen 80;
    listen [::]:80;
    server_name lab.energy-academia.duckdns.org;

    client_max_body_size 30m;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # API бота: закрыт, пока нет сервера n8n. Потом: allow <IP n8n>; перед deny all.
    location /api/bot/ {
        deny all;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
