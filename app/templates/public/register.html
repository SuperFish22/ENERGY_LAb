{% extends "base.html" %}
{% block title %}Регистрация — Energy Lab{% endblock %}
{% block body %}
{% include "partials/public_top.html" %}
<main class="wrap" style="max-width:480px;padding:40px 24px 80px">
  <h1>Добро пожаловать в экипаж</h1>
  {% if error %}<div class="flash error" role="alert">{{ error }}</div>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="field"><label>E-mail</label><input value="{{ email }}" disabled></div>
    <div class="field"><label for="fn">Имя и фамилия</label><input id="fn" name="full_name" required minlength="2"></div>
    <div class="field"><label for="pw">Пароль (от 8 символов)</label><input id="pw" name="password" type="password" minlength="8" required autocomplete="new-password"></div>
    <div class="field"><label><input type="checkbox" name="consent" value="1" required> Согласен на обработку персональных данных по <a href="/privacy">политике</a></label></div>
    <button class="btn btn-launch">Создать аккаунт</button>
  </form>
</main>
{% endblock %}
